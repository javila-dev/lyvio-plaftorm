<!-- Shared token + component system for the onboarding wizard.
     Real Chatwoot visual system (app.lyvio.io), per PRODUCT.md's confirmed
     Brand Commitment: dark by default, Radix slate scale (slate-2/slate-12
     verified live against the real app), brand blue #2781F6, system font
     stack (no webfont), 8px radius everywhere, no hard shadows, and
     active:scale-[0.97-0.98] + hover:brightness-110 microinteractions
     instead of translateY lifts. Included by every standalone onboarding
     shell so the three live steps (registro, bot_config, completado) stay
     one system instead of three separate ones. -->
<style>
    :root {
        /* Radix Slate, dark scale — slate-2 and slate-12 are the two values
           verified live against app.lyvio.io; the rest of the ramp is the
           same canonical Radix scale those two belong to. */
        --slate-1: #111113;
        --slate-2: #18191b;
        --slate-3: #212225;
        --slate-4: #272a2d;
        --slate-5: #2e3135;
        --slate-6: #363a3e;
        --slate-7: #43484e;
        --slate-8: #5a6169;
        --slate-9: #696e77;
        --slate-10: #777b84;
        --slate-11: #b0b4ba;
        --slate-12: #edeef0;

        --bg: var(--slate-1);
        --surface: var(--slate-2);
        --surface-raised: var(--slate-3);
        --surface-hover: var(--slate-4);
        --border: var(--slate-6);
        --border-strong: var(--slate-7);
        --text: var(--slate-12);
        --text-muted: var(--slate-11);
        --text-faint: var(--slate-9);

        --brand: #2781f6;
        --success: #3dd68c;
        --success-bg: #0f2c22;
        --danger: #f87171;
        --danger-bg: #341414;

        --radius: 8px;
        --radius-sm: 6px;
        --radius-pill: 999px;

        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    a { color: var(--brand); }

    .lv-surface {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius);
    }

    .lv-label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 6px;
    }

    .lv-input,
    .lv-select,
    .lv-textarea {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        color: var(--text);
        font-family: var(--font);
        font-size: 0.9375rem;
        padding: 0.6875rem 0.875rem;
        transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .lv-input::placeholder,
    .lv-textarea::placeholder { color: var(--text-muted); }

    .lv-input:hover,
    .lv-select:hover,
    .lv-textarea:hover { border-color: var(--slate-8); }

    .lv-input:focus,
    .lv-select:focus,
    .lv-textarea:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(39, 129, 246, 0.25);
    }

    .lv-input.lv-error,
    .lv-select.lv-error,
    .lv-textarea.lv-error { border-color: var(--danger); }

    .lv-error-text { color: var(--danger); font-size: 0.8125rem; margin-top: 4px; }

    .lv-hint { color: var(--text-faint); font-size: 0.8125rem; margin-top: 4px; }

    .lv-checkbox {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 1.5px solid var(--border-strong);
        background: var(--surface);
        accent-color: var(--brand);
        cursor: pointer;
    }

    .lv-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-family: var(--font);
        font-weight: 600;
        font-size: 0.9375rem;
        padding: 0.75rem 1.375rem;
        border-radius: var(--radius);
        border: 1px solid transparent;
        cursor: pointer;
        text-decoration: none;
        transition: filter 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .lv-btn:active { transform: scale(0.97); }

    .lv-btn-primary { background: var(--brand); color: #fff; }
    .lv-btn-primary:hover { filter: brightness(1.1); }

    .lv-btn-secondary {
        background: var(--surface-raised);
        color: var(--text);
        border-color: var(--border-strong);
    }
    .lv-btn-secondary:hover { background: var(--surface-hover); }

    .lv-btn-ghost { background: transparent; color: var(--text-muted); }
    .lv-btn-ghost:hover { color: var(--text); background: var(--surface-hover); }

    .lv-btn-block { width: 100%; }

    .lv-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

    .lv-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.8125rem;
        font-weight: 600;
        padding: 0.375rem 0.75rem;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border-strong);
        color: var(--text-muted);
    }

    .lv-badge-success { color: var(--success); background: var(--success-bg); border-color: transparent; }

    .lv-alert {
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
        padding: 0.875rem 1rem;
        border-radius: var(--radius);
        font-size: 0.875rem;
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--text-muted);
    }

    .lv-alert i { color: var(--brand); margin-top: 2px; }
    .lv-alert-success { border-color: transparent; background: var(--success-bg); color: var(--success); }
    .lv-alert-success i { color: var(--success); }

    /* Wizard step indicator — dots, not a numbered kicker; brand fill for
       done/current, slate for pending. Shared by every step so the same
       shape reads identically at registro / bot_config / completado. */
    .lv-steps { display: flex; align-items: center; gap: 8px; }
    .lv-step-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--slate-6);
    }
    .lv-step-dot.done { background: var(--brand); }
    .lv-step-dot.current { background: var(--brand); box-shadow: 0 0 0 3px rgba(39,129,246,0.25); }
    .lv-step-line { flex: 1; height: 1px; background: var(--slate-6); }
    .lv-step-line.done { background: var(--brand); }
</style>
